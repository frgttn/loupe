name: Release

# Pushing a tag `v<version>` builds Loupe, packs it with Velopack and
# publishes a GitHub release: the installer (`Loupe-win-Setup.exe`), a
# portable zip, and the packages and feed the installed app updates from.
# The tag must match the workspace version, and CHANGELOG.md must have a
# section for it; see "Releasing" in README.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Keep equal to the `velopack` crate in Cargo.toml.
  VPK_VERSION: 1.3.39-g8d2844f
  # Loupe's own update feed (`releases.stable.json`). Releases up to 1.1.1 were
  # Spotlight on the default `win` channel; Velopack doesn't check the package
  # id of an update, so sharing that feed would let an installed Spotlight
  # install Loupe into its own folder. Spotlight finds no new feed and stays.
  VPK_CHANNEL: stable

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: Swatinem/rust-cache@v2

      - name: Version and release notes
        id: version
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $crate = ($metadata.packages | Where-Object name -eq 'loupe').version
          if ($crate -ne $version) {
            throw "The tag says $version, but the workspace version is $crate"
          }
          # The CHANGELOG.md section "## [<version>] …", without its heading.
          $section = (Get-Content CHANGELOG.md -Raw) -split '(?m)^## ' |
            Where-Object { $_ -match "^\[$([regex]::Escape($version))\]" }
          if (-not $section) { throw "CHANGELOG.md has no section for $version" }
          ($section -replace '^[^\n]*\n', '').Trim() | Set-Content release-notes.md
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Test
        run: cargo test --workspace --release

      - name: Build
        run: cargo build --release -p loupe -p loupe-service

      - name: Install vpk
        run: dotnet tool install --global vpk --version $env:VPK_VERSION

      # The previous release, so the new one also ships a delta package (a
      # small update for those on it). There is none before the first.
      - name: Download the previous release
        continue-on-error: true
        run: >
          vpk download github
          --repoUrl ${{ github.server_url }}/${{ github.repository }}
          --token ${{ secrets.GITHUB_TOKEN }}
          --channel $env:VPK_CHANNEL

      - name: Pack
        run: |
          New-Item -ItemType Directory publish | Out-Null
          Copy-Item target/release/loupe.exe, target/release/loupe-service.exe publish/
          vpk pack `
            --packId Loupe `
            --packVersion ${{ steps.version.outputs.version }} `
            --packTitle Loupe `
            --packAuthors frgttn `
            --channel $env:VPK_CHANNEL `
            --packDir publish `
            --mainExe loupe.exe `
            --icon crates/app/assets/icon.ico `
            --releaseNotes release-notes.md `
            --shortcuts StartMenuRoot

      - name: Publish
        run: >
          vpk upload github
          --repoUrl ${{ github.server_url }}/${{ github.repository }}
          --token ${{ secrets.GITHUB_TOKEN }}
          --tag ${{ github.ref_name }}
          --channel $env:VPK_CHANNEL
          --releaseName "Loupe ${{ steps.version.outputs.version }}"
          --publish
