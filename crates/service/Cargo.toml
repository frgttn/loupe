[package]
name = "loupe-service"
description = "Loupe's optional file index service: reads NTFS file tables and change journals as LocalSystem and serves the launcher over a named pipe"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# All Windows-only: elsewhere the binary only says so.
[target.'cfg(windows)'.dependencies]
loupe-files.workspace = true
loupe-platform-win.workspace = true

[target.'cfg(windows)'.dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_System_Threading",
]
