[package]
name = "loupe-platform"
description = "Loupe's platform layer: the integration for the OS it is built for, under one set of module names"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
async-channel.workspace = true
# Sites' icons come in any of these; Lens gets a PNG.
image = { workspace = true, features = ["png", "ico", "bmp", "jpeg", "gif", "webp"] }
loupe-core.workspace = true

[target.'cfg(windows)'.dependencies]
loupe-platform-win.workspace = true

# Pure Rust while it is stubs, so Windows builds it too for `--cfg loupe_mac_stub`.
[dependencies.loupe-platform-mac]
workspace = true

[lints.rust]
# `--cfg loupe_mac_stub` builds Windows against the macOS crate (see loupe-platform).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loupe_mac_stub)"] }
