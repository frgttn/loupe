[workspace]
resolver = "3"
members = ["crates/*"]
# Patched dependencies, built but not linted or tested as ours.
exclude = ["vendor"]
default-members = ["crates/app", "crates/service"]

[workspace.package]
edition = "2024"
version = "1.1.1"
# Let chains (`if let … && …`) need 1.88.
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/frgttn/loupe"
publish = false

[workspace.dependencies]
loupe-core = { path = "crates/core" }
loupe-files = { path = "crates/files" }
loupe-platform = { path = "crates/platform" }
loupe-platform-win = { path = "crates/platform-win" }
loupe-providers = { path = "crates/providers" }
loupe-qr = { path = "crates/qr" }
loupe-search = { path = "crates/search" }
loupe-store = { path = "crates/store" }
loupe-ui = { path = "crates/ui" }
async-channel = "2"
# Calculator: units, arbitrary precision, no dependencies of its own.
fend-core = "1.5.9"
# File index: sorted, compressed set of file names with prefix lookups.
fst = "0.4.7"
gpui = "=0.2.2"
# Only for its `Frame`/`RgbaImage` types in GPUI's image API; same version as gpui uses.
image = { version = "0.25", default-features = false }
# File search matcher: SIMD Smith-Waterman with typos, no dependencies (taken from fff).
neo_frizbee = "0.13.3"
nucleo-matcher = "0.3.1"
# QR codes: making them (no image or SVG output of its own) and reading them.
qrcode = { version = "0.14.1", default-features = false }
rqrr = { version = "0.11.0", default-features = false }
# Markdown in detail views; no HTML output needed.
pulldown-cmark = { version = "0.13", default-features = false }
raw-window-handle = "0.6"
# `bundled-sqlcipher` compiles SQLCipher (SQLite with encryption) from source,
# so there is no system library to install; its crypto is Windows CNG, see
# the patch below.
rusqlite = { version = "0.40", features = ["bundled-sqlcipher"] }
serde_json = "1"
tray-icon = "0.24"
unicode-segmentation = "1"
# Installer and updates: hooks the installer runs, and updates from GitHub
# Releases. Keep it equal to the `vpk` version in `.github/workflows/release.yml`.
velopack = "=1.3.39-g8d2844f"
# Same major as gpui 0.2.2 uses, so there is only one copy of the bindings.
windows = "0.61"
# Direct2D's point and matrix types; the version windows 0.61 uses.
windows-numerics = "0.2"

# libsqlite3-sys with one change: on Windows, SQLCipher's crypto comes from
# CNG (bcrypt.dll, `sqlcipher/crypto_cng.c`) instead of OpenSSL, so building
# needs no OpenSSL or Perl. Its unused plain-SQLite sources are left out.
# Keep its version equal to the one rusqlite asks for.
[patch.crates-io]
libsqlite3-sys = { path = "vendor/libsqlite3-sys" }

[profile.release]
debug = "line-tables-only"
